#     abort_xiaoai_on_play: true

# 电脑端语音识别（服务端唤醒模式）。配合 client 的 -mic-stream 使用：
# 音箱推麦克风音频 → 本服务 VAD 切句 → 这个 Python 进程转文字。
asr:
  enabled: true
  # 唤醒监听用哪套：local = SenseVoice（快），没听准时由 Paraformer 兜底
  wake_provider: "local"
  # 唤醒之后的对话识别，可运行时切换：
  #   doubao_stream = 火山引擎流式
  #   doubao        = 火山引擎整段（非流式）
  #   local         = SenseVoice
  #   local_alt     = SenseVoice + Paraformer 兜底
  # 旧字段 provider 仍兼容，新配置请用 dialog_provider。
  dialog_provider: "local"
  provider: "local"
  python: "/tmp/sherpa-venv/bin/python"
  script: "/Users/kop/pyin/xiaoai/tools/asr-worker/asr_worker.py"

  # 豆包语音识别（火山引擎 v3 大模型录音文件识别）凭据
  api_key: "69a4525d-f4ff-4edc-95d2-a74f36038414"
  # 整段识别（准确，1.3s+）
  resource_id: "volc.seedasr.auc"
  # 流式识别（边说边出字，最终结果快）
  stream_resource_id: "volc.bigasr.sauc.duration"

# Home Assistant（走 HA 控制家电；base_url + token 都填了才启用）
# token 在 HA：左下角头像 → 个人资料 → 安全 → 长期访问令牌 → 创建
homeassistant:
  base_url: "http://homeassistant.local:8123"
  token: ""

# B 站音乐：公开视频搜索、在线试听与按需保存最高音质。
# ffmpeg 需要支持 libmp3lame；缓存文件只保留在本机。
bilibili:
  enabled: true
  cookie: ""
  cache_dir: "../../.bilibili-cache"
  music_dir: "../../music"
  ffmpeg: "ffmpeg"
  max_size_mb: 800
  search_limit: 12

# 本地参考资料知识库：管理端负责导入、发布与停用，Node worker 只读检索。
# 部署到其他机器时把 root / script 改成该机绝对路径，不要把本机路径整份覆盖过去。
knowledge:
  enabled: true
  root: "../../knowledge"
  node: "node"
  script: "../../tools/knowledge/server.cjs"
  timeout_seconds: 8
  max_upload_mb: 20

# 放音乐时自动压低音量：音乐太响会把说话声盖住（没有 AEC，事后分离也救不回来），
# 压小一点 ASR 才听得清「下一首」「停止」。停播/放完自然结束时还原成原来的音量；
# 期间你自己调过音量（按键、"大点声"）则不还原，尊重你的选择。
music_duck:
  enabled: true
  volume: 35   # 压到的音量 0-100

# 原生唤醒接管（音乐态）。音乐大声时只有原生 KWS 听得见「小爱同学」，
# 打开后：原生 ASR final 交给豆包；freeze 模式暂停 aivs，instruction 模式按 dialog 拦截动作。
# 豆包 WAV 走 notify，与音乐共存；完整效果仍需原生唤醒实测。
# 代价是原生小爱在这轮不出声；家电类指令仍按 native_keywords 交还原生。
native_wake:
  isolation_mode: freeze   # freeze=兼容冻结；instruction=实验性指令隔离，需音箱加载 native_guard.so
  takeover_enabled: false  # 默认关；实机验收通过后再打开
  max_seconds: 25          # 单轮接管上限，超时强制解冻，避免音乐永久停住

# 音乐态语义路由：**只有带唤醒词的话才进这里**（歌词不可能含唤醒词，所以不带唤醒词
# 的句子只会走本地白名单，其余直接丢弃，不花模型钱）。模型判意图：
# next / stop / volume_up / volume_down / mute / unmute / play / dialog / ignore。
# 模型只输出 JSON，置信度低于 min_confidence 一律不动手（当噪声丢掉）。
music_router:
  enabled: true
  engine: "llm"          # llm：分类器优先（~0.9s），失败才升级 codex | codex：全部走 codex（~4s）
  model: ""              # 留空用上面的 llm.model
  timeout_ms: 1500       # 超时按 ignore 处理，不能让语音卡住
  min_confidence: 0.6
  # 路由线程的系统提示词；留空用内置默认（指令执行器，不陪聊）
  prompt: ""

# 听书：正文复用知识库，独立保存豆包 WAV 与章节书签；配置修改后重启服务。
audiobook:
  enabled: true
  cache_dir: ""             # 留空为 config 同级 audiobooks/；不受普通对话缓存清理影响
  chunk_chars: 180           # 每段最多字符数（80-400），优先在句末断开；改动后需重新选章
  prefetch: 2                # 只准备当前段及后面 2 段（1-3），不会一次合成整本书
  synthesis_gap_ms: 1000     # 新合成请求串行，相邻请求至少间隔 1 秒；缓存命中不重新请求
